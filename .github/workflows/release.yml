name: Publish Release Asset

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension (production)
        run: npm run build:prod

      - name: Bundling the extension (production)
        run: npm run package

      - name: Post bundling the extension (production)
        run: |
          zip_file="$(ls dist/Discord-Auto-Quest-v*.zip)"
          new_zip_file="release/$(basename "${zip_file%.zip}.min.zip")"

          mkdir -p release
          mv "$zip_file" "$new_zip_file" --verbose
          ls -la release/Discord-Auto-Quest-v*.zip

      - name: Build extension
        run: npm run build
  
      - name: Bundling the extension
        run: npm run package

      - name: Post bundling the extension
        run: |
          zip_file="$(ls dist/Discord-Auto-Quest-v*.zip)"

          mv "$zip_file" release/ --verbose
          ls -la release/Discord-Auto-Quest-v*.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Discord-Auto-Quest-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}