name: Publish Release Asset

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension (production)
        run: bash .github/scripts/build.sh --minify

      - name: Post build extension (production)
        run: |
          zip_files="$(ls dist/Discord-Auto-Quest-v*.zip)"

          mkdir -p release/
          mv "$zip_files" release/ --verbose
          ls -la release/Discord-Auto-Quest-v*.zip

      - name: Build extension
        run: bash .github/scripts/build.sh

      - name: Post bundling the extension
        run: |
          zip_files="$(ls dist/Discord-Auto-Quest-v*.zip)"

          mv "$zip_files" release/ --verbose
          ls -la release/Discord-Auto-Quest-v*.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Discord-Auto-Quest-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}