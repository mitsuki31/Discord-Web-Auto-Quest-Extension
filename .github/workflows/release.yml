name: Publish Release Asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: bash .github/scripts/build.sh --minify

      - name: Collect production artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          mkdir -p release/

          zip_files=(dist/Discord-Auto-Quest-v*.zip)

          if (( ${#zip_files[@]} != 2 )); then
            echo "Expected 2 production ZIP files, found ${#zip_files[@]}" >&2
            exit 1
          fi

          mv "${zip_files[@]}" release/ --verbose

          ls -la release/Discord-Auto-Quest-v*.zip

      - name: Validate release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          zip_files=(release/Discord-Auto-Quest-v*.zip)

          if (( ${#zip_files[@]} != 2 )); then
            echo "Expected 2 release ZIP files, found ${#zip_files[@]}" >&2
            exit 1
          fi

          echo "Release assets:"
          printf ' - %s\n' "${zip_files[@]}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/Discord-Auto-Quest-v*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
